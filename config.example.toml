# probe-rs canonical configuration
# schema 缺省为 0(旧版配置),启动时自动迁移为本格式并置 1。
schema = 1

# 数据目录:net_static.json 等运行态文件都存放在这里。
# Windows 默认 C:\ProgramData\probe-rs
data_dir = "/var/lib/probe-rs"

# stable only follows normal GitHub Releases. prerelease follows both beta/RC
# releases and a later stable release. The version must increase by SemVer.
[auto_update]
enabled = false
# Optional local override. Release builds default to the repository that built
# them; source builds have no implicit update source.
# repository = "owner/probe-rs"
channel = "stable" # stable | prerelease
check_interval = 21600 # seconds; minimum 300
proxys = [] # direct GitHub download first, then try these proxy prefixes in order

# 下方同时展示 CF、Komari、probe 三种协议。实际部署请删除不使用的示例
# Reporter，只保留所需线路，并完整替换该协议段中的占位连接信息。

# ----------------------------------------------------------------------
# CF 上报线(命名对齐 cfsm-agent)
#
# 采集行为说明:collect_interval=0 时，auto 映射为 wss_report_interval，
# http 映射为 interval；这里只定义当前 Reporter 的采集需求。
# interface 参与全局网卡并集(任一路为空 = 全部);ct/cu/cm/bd 非空时
# 各生成一个 Ping 任务（HTTP(S) URL 推断为 HTTP，其余为 TCP），按目标去重、
# 周期取最小；CF 线固定启用 GPU。
[[reporters]]
id = "primary"

[reporters.cf]
server_id = "cf-server-uuid"
secret = "cf-api-secret"
url = "https://monitor.example.com/update"
connection_mode = "auto" # auto = WSS + POST fallback; http = POST only
interval = 60          # 上报周期(原版 report_interval)
collect_interval = 0   # 0 = 不额外高频采集
wss_report_interval = 2 # auto + collect_interval=0 时的实际采集周期
reset_day = 1          # 流量统计月份重置日
interface = ""         # 逗号分隔;空 = 全部默认物理网卡
ct = "gd-ct-dualstack.ip.zstaticcdn.com:80"
cu = "gd-cu-dualstack.ip.zstaticcdn.com:80"
# cm = ""
# bd = ""
# config_version 由 Agent 应用远端配置后回写至 reporters.cf.ext,勿手填

# ----------------------------------------------------------------------
# Komari 上报线(命名对齐 komari-agent)
[[reporters]]
id = "komari"

[reporters.komari]
endpoint = "https://komari.example.com"
token = "komari-token"
interval = 1           # 采集周期,komari 按采集周期上报
month_rotate = 12      # 流量统计月份重置日(0 = 禁用)
enable_gpu = true
include_nics = ""        # 逗号分隔通配符;空 = 全部
include_mountpoints = "" # 分号分隔;空 = 全部

# Komari 下发 Ping 目标后,Agent 会在 ext 下自动持久化最多 5 个
# learned_pings,跟随全局 ping 周期,LRU 淘汰。该列表是探针自生成
# 状态,非 komari 配置,勿手填:
# [reporters.komari.ext]
# [[reporters.komari.ext.learned_pings]]
# type = "icmp"
# target = "1.1.1.1"
# last_seen_at = 1786252800000

# ----------------------------------------------------------------------
# probe 上报线(probe-rs 原生协议,采集配置实体的完整形态)
[[reporters]]
id = "local-demo"

[reporters.probe]
server_id = "my-host"
secret = "change-me"
worker_url = "http://127.0.0.1:8080/report"
report_interval = 1
reset_day = 1
report_errors = true   # probe 以 errors 上报；Komari 映射为 message；CF 无错误落点
report_self = true     # 仅 probe 线可配；cf/komari 不上报 self
interfaces = []        # 空 = 全部
disks = []             # 空 = 全部
report_gpu = true

[reporters.probe.intervals]
collect = 1
ping = 30
slow = 60
gpu = 60
ip = 600
diskio = 10

# Ping 目标是 endpoint:path/query/fragment 不允许。
# 与其他上报线的同名/同目标任务按 type+规范化目标去重,周期取最小。
[[reporters.probe.pings]]
name = "homepage"
type = "http" # http | tcp | icmp
target = "https://example.com"
interval = 60

[[reporters.probe.pings]]
name = "dns-edge"
type = "icmp"
target = "1.1.1.1"
interval = 60

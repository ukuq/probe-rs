# probe-rs canonical configuration (0.1.3-beta.1+)
# Global = actual collection/async workers. Every output connection lives in [[reporters]].

# Persistent per-interface traffic ledger. Windows default:
# C:\ProgramData\probe-rs\net_static.json
net_static_path = "/var/lib/probe-rs/net_static.json"

# Actually start the GPU worker. report_gpu on each Reporter only filters output.
enable_gpu = true

# Actual machine-wide collection periods. There is deliberately no report here.
[intervals]
collect = 1
ping = 30
slow = 60
gpu = 60
ip = 600
diskio = 10

# Global Ping workers. interval is optional and falls back to intervals.ping.
[[pings]]
name = "ct"
target = "gd-ct-dualstack.ip.zstaticcdn.com:80"
interval = 30

[[pings]]
name = "cu"
target = "gd-cu-dualstack.ip.zstaticcdn.com:80"
interval = 30

# All connections, including primary, are ordinary independent Reporters.
[[reporters]]
id = "primary"
protocol = "cf" # probe | cf | komari
server_id = "cf-server-uuid"
secret = "cf-api-secret"
worker_url = "https://monitor.example.com/update"
config_version = ""
report_interval = 30
reset_day = 1
interfaces = []
report_gpu = true
report_errors = true
report_self = false
# Missing ping_names means all global pings; [] means none.
ping_names = ["ct", "cu"]

[reporters.ext.cf]
correction = true
batch = true

[[reporters]]
id = "komari"
protocol = "komari"
server_id = "my-host"
secret = "komari-token"
worker_url = "https://komari.example.com"
config_version = ""
report_interval = 1
reset_day = 12
interfaces = []
report_gpu = true
report_errors = true
report_self = false
ping_names = []

[[reporters]]
id = "local-demo"
protocol = "probe"
server_id = "my-host"
secret = "change-me"
worker_url = "http://127.0.0.1:8080/report"
config_version = ""
report_interval = 1
reset_day = 1
interfaces = []
report_gpu = true
report_errors = true
report_self = true
# Omit ping_names to publish all global ping results to this Reporter.

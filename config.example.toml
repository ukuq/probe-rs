# probe-rs canonical configuration (0.1.3-beta.1+)
# Every Reporter declares its own collection demand. The agent computes one
# machine-wide worker plan: periods take the minimum, GPU uses OR, and
# interfaces/disks/Ping tasks use a union.

# Persistent per-interface traffic ledger. Windows default:
# C:\ProgramData\probe-rs\net_static.json
net_static_path = "/var/lib/probe-rs/net_static.json"

[[reporters]]
id = "primary"
protocol = "cf" # probe | cf | komari
server_id = "cf-server-uuid"
secret = "cf-api-secret"
worker_url = "https://monitor.example.com/update"
config_version = ""
report_interval = 30
reset_day = 1
interfaces = [] # empty = all default physical interfaces
disks = []      # empty = all volumes / physical disks
report_gpu = true
report_errors = true
report_self = false

[reporters.intervals]
collect = 1
ping = 30
slow = 60
gpu = 60
ip = 600
diskio = 10

[[reporters.pings]]
name = "ct"
type = "tcp" # http | tcp | icmp
target = "gd-ct-dualstack.ip.zstaticcdn.com:80"
interval = 30

[[reporters.pings]]
name = "cu"
type = "tcp"
target = "gd-cu-dualstack.ip.zstaticcdn.com:80"
interval = 30

[reporters.ext.cf]
correction = true
batch = true

[[reporters]]
id = "komari"
protocol = "komari"
server_id = "my-host"
secret = "komari-token"
worker_url = "https://komari.example.com"
config_version = ""
report_interval = 1
reset_day = 12
interfaces = []
disks = []
report_gpu = true
report_errors = true
report_self = false

[reporters.intervals]
collect = 1
ping = 30
slow = 60
gpu = 60
ip = 600
diskio = 10

[[reporters]]
id = "local-demo"
protocol = "probe"
server_id = "my-host"
secret = "change-me"
worker_url = "http://127.0.0.1:8080/report"
config_version = ""
report_interval = 1
reset_day = 1
interfaces = []
disks = []
report_gpu = true
report_errors = true
report_self = true

[reporters.intervals]
collect = 1
ping = 30
slow = 60
gpu = 60
ip = 600
diskio = 10

# Same type + normalized endpoint as another Reporter is collected once.
# The effective task interval is the minimum requested by its consumers.
[[reporters.pings]]
name = "ct-local"
type = "tcp"
target = "gd-ct-dualstack.ip.zstaticcdn.com:80"
interval = 30

[[reporters.pings]]
name = "homepage"
type = "http"
target = "https://example.com/health"
interval = 60

[[reporters.pings]]
name = "dns-edge"
type = "icmp"
target = "1.1.1.1"
interval = 60

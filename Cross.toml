[build.env]
# Release 产物需保留当前 Fork 的更新来源；cross 默认不会把任意宿主变量
# 传入构建容器。
passthrough = ["PROBE_RS_UPDATE_REPOSITORY"]

[target.loongarch64-unknown-linux-musl]
# cross 0.2.5 predates this upstream target image and otherwise falls back to
# the host linker. Pin the official image so LoongArch64 builds stay reproducible.
image = "ghcr.io/cross-rs/loongarch64-unknown-linux-musl@sha256:148a0ac554b0cdc79fd6ed4f0eee1645e70738291cf2894677eee6a0945ba41a"

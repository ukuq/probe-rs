# CI：格式化与测试门禁（所有分支 push / 所有 PR）
# 发版见 release.yml
name: ci

on:
  push:
  pull_request:

# 同一分支/PR 重复触发（push + synchronize）时只保留最新一次
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # 与 release 使用同一 stable 工具链
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ runner.os }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Validate PowerShell deploy scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @('deploy/install.ps1', 'deploy/cf-install.ps1')) {
            $tokens = $null
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            )
            foreach ($error in $errors) {
              Write-Error "$file`: $($error.Message)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deploy shell scripts
        run: |
          sh -n deploy/install.sh
          sh -n deploy/cf-install.sh
          bash -n deploy/komari-install.sh
      - name: Validate deploy generator JavaScript
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('deploy/deploy-generator.html', 'utf8');
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          if (scripts.length === 0) throw new Error('no inline script found');
          for (const script of scripts) new Function(script[1]);
          NODE

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.11
      - run: deno fmt --check server-demo/
      - run: deno check server-demo/server.ts

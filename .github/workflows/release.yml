# 自动构建并发版：tag 取自 Cargo.toml 的 version（v<version>）
# release 同时具有全部平台产物才算完成；缺少任一产物时可安全重试。
# 产物命名与 deploy/cf-install.sh、deploy/cf-install.ps1 的下载地址对应。
name: release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      ref: ${{ steps.meta.outputs.ref }}
      skip: ${{ steps.meta.outputs.skip }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ -n "$ver" ] || { echo "Cargo.toml 未找到 version" >&2; exit 1; }
          tag="v$ver"
          case "$ver" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            build_ref="$tag"
          else
            build_ref="$GITHUB_SHA"
          fi

          assets=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' 2>/dev/null || true)
          published_prerelease=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json isPrerelease --jq '.isPrerelease' 2>/dev/null || true)
          complete=true
          for name in probe-rs-linux-x86_64 probe-rs-linux-aarch64 probe-rs-windows-x86_64.exe SHA256SUMS; do
            if ! grep -Fxq "$name" <<<"$assets"; then
              complete=false
            fi
          done
          if [ -n "$published_prerelease" ] && [ "$published_prerelease" != "$prerelease" ]; then
            complete=false
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=$build_ref" >> "$GITHUB_OUTPUT"
          echo "skip=$complete" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          if [ "$complete" = true ]; then
            echo "$tag 的全部平台产物均已存在，跳过发版"
          else
            echo "$tag 产物不完整，将从 $build_ref 构建并发版"
          fi

  build:
    needs: metadata
    if: needs.metadata.outputs.skip == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            name: probe-rs-linux-x86_64
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            name: probe-rs-linux-aarch64
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            name: probe-rs-windows-x86_64.exe
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: 验证 Rust 编译目标（Linux）
        if: runner.os == 'Linux'
        run: rustup target list --toolchain stable --installed | grep -Fx "${{ matrix.target }}"
      - name: 验证 Rust 编译目标（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installed = rustup target list --toolchain stable --installed
          if ($installed -notcontains '${{ matrix.target }}') {
            throw 'Rust target is not installed: ${{ matrix.target }}'
          }
      - name: 安装 Linux 静态交叉编译工具
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: 构建（Linux）
        if: runner.os == 'Linux'
        run: |
          cross build --locked --release --target "${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/probe-rs" "${{ matrix.name }}"
      - name: 验证 Linux 产物为静态链接且不依赖 glibc
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          binary="${{ matrix.name }}"
          file "$binary"
          dynamic=$(readelf -d "$binary" 2>&1)
          if grep -q '(NEEDED)' <<<"$dynamic"; then
            echo "Linux artifact contains dynamic dependencies:" >&2
            echo "$dynamic" >&2
            exit 1
          fi
          glibc_refs=$(strings "$binary" | grep -E 'GLIBC_[0-9]+\.[0-9]+' || true)
          if [ -n "$glibc_refs" ]; then
            echo "Linux artifact unexpectedly references glibc:" >&2
            echo "$glibc_refs" >&2
            exit 1
          fi
      - name: 构建（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo +stable build --locked --release --target "${{ matrix.target }}"
          Copy-Item "target/${{ matrix.target }}/release/probe-rs.exe" "${{ matrix.name }}"
      - name: 保存构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
          if-no-files-found: error

  release:
    needs: [metadata, build]
    if: needs.metadata.outputs.skip == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部架构产物
        uses: actions/download-artifact@v4
        with:
          pattern: probe-rs-*
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: dist
        run: |
          sha256sum \
            probe-rs-linux-x86_64 \
            probe-rs-linux-aarch64 \
            probe-rs-windows-x86_64.exe > SHA256SUMS
      - name: 一次性发布全部架构产物
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          target_commitish: ${{ needs.metadata.outputs.ref }}
          name: ${{ needs.metadata.outputs.tag }}
          prerelease: ${{ needs.metadata.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            dist/probe-rs-linux-x86_64
            dist/probe-rs-linux-aarch64
            dist/probe-rs-windows-x86_64.exe
            dist/SHA256SUMS

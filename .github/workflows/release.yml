# 自动构建并发版：全部平台先构建并校验，最后才按 Cargo.toml 的 version
# 创建 tag（v<version>）并一次性上传全部产物；缺少任一产物时可安全重试。
# 产物命名与 deploy/cf-install.sh、deploy/cf-install.ps1 的下载地址对应。
name: release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            name: probe-rs-linux-x86_64
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            name: probe-rs-linux-aarch64
            os: ubuntu-latest
          - target: loongarch64-unknown-linux-musl
            name: probe-rs-linux-loong64
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            name: probe-rs-windows-x86_64.exe
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: 验证 Rust 编译目标（Linux）
        if: runner.os == 'Linux'
        run: rustup target list --toolchain stable --installed | grep -Fx "${{ matrix.target }}"
      - name: 验证 Rust 编译目标（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installed = rustup target list --toolchain stable --installed
          if ($installed -notcontains '${{ matrix.target }}') {
            throw 'Rust target is not installed: ${{ matrix.target }}'
          }
      - name: 安装 Linux 静态交叉编译工具
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: 构建（Linux）
        if: runner.os == 'Linux'
        run: |
          cross build --locked --release --target "${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/probe-rs" "${{ matrix.name }}"
      - name: 验证 Linux 产物为静态链接且不依赖 glibc
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          binary="${{ matrix.name }}"
          file "$binary"
          dynamic=$(readelf -d "$binary" 2>&1)
          if grep -q '(NEEDED)' <<<"$dynamic"; then
            echo "Linux artifact contains dynamic dependencies:" >&2
            echo "$dynamic" >&2
            exit 1
          fi
          glibc_refs=$(strings "$binary" | grep -E 'GLIBC_[0-9]+\.[0-9]+' || true)
          if [ -n "$glibc_refs" ]; then
            echo "Linux artifact unexpectedly references glibc:" >&2
            echo "$glibc_refs" >&2
            exit 1
          fi
      - name: 构建（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo +stable build --locked --release --target "${{ matrix.target }}"
          Copy-Item "target/${{ matrix.target }}/release/probe-rs.exe" "${{ matrix.name }}"
      - name: 保存构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: 确定最终发布信息
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ -n "$ver" ] || { echo "Cargo.toml 未找到 version" >&2; exit 1; }
          tag="v$ver"
          case "$ver" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac

          assets=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' 2>/dev/null || true)
          published_prerelease=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json isPrerelease --jq '.isPrerelease' 2>/dev/null || true)
          complete=true
          for name in probe-rs-linux-x86_64 probe-rs-linux-aarch64 probe-rs-linux-loong64 probe-rs-windows-x86_64.exe SHA256SUMS; do
            if ! grep -Fxq "$name" <<<"$assets"; then
              complete=false
            fi
          done
          if [ -n "$published_prerelease" ] && [ "$published_prerelease" != "$prerelease" ]; then
            complete=false
          fi

          publish=true
          if [ "$complete" = true ]; then
            publish=false
            echo "$tag 的全部平台产物均已存在，跳过发版"
          elif git show-ref --verify --quiet "refs/tags/$tag"; then
            tag_commit=$(git rev-list -n 1 "$tag")
            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo "$tag 已指向 $tag_commit，拒绝用 $GITHUB_SHA 的产物覆盖；请更新版本号或清理未完成的 tag/Release" >&2
              exit 1
            fi
            echo "$tag 指向当前提交但产物不完整，将安全重试上传"
          else
            echo "全部构建已完成，将为 $GITHUB_SHA 创建 $tag 并上传产物"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: 下载全部架构产物
        if: steps.meta.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: probe-rs-*
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 checksums
        if: steps.meta.outputs.publish == 'true'
        working-directory: dist
        run: |
          sha256sum \
            probe-rs-linux-x86_64 \
            probe-rs-linux-aarch64 \
            probe-rs-linux-loong64 \
            probe-rs-windows-x86_64.exe > SHA256SUMS
      - name: 一次性发布全部架构产物
        if: steps.meta.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            dist/probe-rs-linux-x86_64
            dist/probe-rs-linux-aarch64
            dist/probe-rs-linux-loong64
            dist/probe-rs-windows-x86_64.exe
            dist/SHA256SUMS

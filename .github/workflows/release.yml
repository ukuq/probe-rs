# 自动构建并发版：tag 取自 Cargo.toml 的 version（v<version>）
# 该 tag 已存在 → 跳过（幂等）；不存在 → 构建并发版
# 产物命名与 deploy/cf-install.sh 的下载地址对应：probe-rs-linux-<arch>
name: release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      skip: ${{ steps.t.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: t
        run: |
          set -e
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ -n "$ver" ] || { echo "Cargo.toml 未找到 version" >&2; exit 1; }
          tag="v$ver"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "tag $tag 已存在，跳过发版"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "将发版 $tag"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    if: needs.tag.outputs.skip == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            name: probe-rs-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            name: probe-rs-linux-aarch64
            linker: aarch64-linux-gnu-gcc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: 安装交叉链接器（aarch64）
        if: matrix.linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: 构建
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: |
          cargo build --release --target "${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/probe-rs" "${{ matrix.name }}"
      - name: 发版
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          name: ${{ needs.tag.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ matrix.name }}
